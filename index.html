function openHost(){let orders=JSON.parse(localStorage.getItem('bellini-orders')||'[]'),counts={};orders.forEach(o=>o.items.forEach(i=>counts[i.name]=(counts[i.name]||0)+1));let total=orders.reduce((s,o)=>s+o.total,0);let rows=Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([n,q])=>`<div class="summary-row"><span>${n}</span><b>× ${q}</b></div>`).join('')||'<p class="empty">尚未收到訂單</p>';let people=orders.map(o=>`<div class="person-order"><b>${o.person}</b>　${money(o.total)}<small>${orderSummary(o).replaceAll('\n','<br>')}${o.note?'<br>備註：'+o.note:''}</small></div>`).join('');$('#cartList').innerHTML=`<div class="dash"><div class="stat"><div>訂購人<b>${orders.length}</b></div><div>餐點總數<b>${orders.reduce((s,o)=>s+o.items.length,0)}</b></div><div>預估總額<b>${money(total)}</b></div></div><h4>餐廳備餐統整</h4>${rows}<h4>個別訂單</h4>${people||'<p class="empty">尚未收到訂單</p>'}</div>`;document.querySelector('#cartModal header h3').textContent='主揪管理';document.querySelector('#cartModal footer').innerHTML='<div class="order-actions"><button class="secondary" id="hostCopy">複製統整</button><button class="primary" id="exportCsv">匯出 CSV</button></div>';$('#cartModal').classList.add('open');let text=`BELLINI 團隊統整\n訂購人：${orders.length} 位\n預估總額：${money(total)}\n\n`+Object.entries(counts).map(([n,q])=>`${n} × ${q}`).join('\n');$('#hostCopy').onclick=async()=>{await navigator.clipboard.writeText(text);$('#hostCopy').textContent='已複製 ✓'};$('#exportCsv').onclick=()=>{let lines=['訂購人,餐點,套餐選擇,價格,備註'];orders.forEach(o=>o.items.forEach(i=>lines.push([o.person,i.name,i.detail||'',i.price,o.note||''].map(v=>'"'+String(v).replaceAll('"','""')+'"').join(','))));let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv'}));a.download='bellini-team-orders.csv';a.click();URL.revokeObjectURL(a.href)}}
