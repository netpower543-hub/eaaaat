<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BELLINI Pasta Pasta 聚會點餐</title>
  <style>
    :root {
      --primary: #FF6B35;
      --primary-light: #FFF0EB;
      --dark: #2B2D42;
      --gray-bg: #F8F9FA;
      --gray-text: #6C757D;
      --border: #E9ECEF;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background-color: #EFEFEF;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .mobile-container {
      width: 100%;
      max-width: 480px;
      background: #FFFFFF;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      padding-bottom: 100px;
    }

    .header {
      padding: 16px;
      background: #FFFFFF;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border);
      text-align: center;
    }
    .store-name { font-size: 18px; font-weight: 700; color: var(--dark); margin-bottom: 8px; }
    
    .menu-link-btn {
      display: inline-block;
      width: 100%;
      padding: 10px;
      background: var(--primary-light);
      color: var(--primary);
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      border-radius: 10px;
      border: 1px solid var(--primary);
    }

    .content-section { padding: 16px; flex: 1; }
    .input-group { margin-bottom: 16px; }
    .input-label { font-size: 14px; font-weight: 700; color: var(--dark); margin-bottom: 6px; display: block; }
    .input-box {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    .category-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--primary);
      margin: 20px 0 10px;
      padding-bottom: 4px;
      border-bottom: 2px solid var(--primary-light);
    }

    .food-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      margin-bottom: 8px;
      background: #FFF;
    }
    .food-info { flex: 1; padding-right: 8px; }
    .food-name { font-size: 14px; font-weight: 600; color: var(--dark); margin-bottom: 2px; }
    .food-price { font-size: 14px; font-weight: 700; color: var(--primary); }
    
    .add-btn {
      background: var(--primary-light);
      color: var(--primary);
      border: 1px solid var(--primary);
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .add-btn:active { background: var(--primary); color: #FFF; }

    .cart-bar {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 448px;
      background: var(--dark);
      color: #FFF;
      padding: 12px 20px;
      border-radius: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      z-index: 200;
    }
    .cart-info { display: flex; align-items: center; gap: 12px; }
    .cart-badge {
      background: var(--primary);
      color: #FFF;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
    }
    .cart-total { font-size: 15px; font-weight: 700; }
    .checkout-btn {
      background: var(--primary);
      color: #FFF;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="mobile-container">
  <div class="header">
    <div class="store-name">BELLINI Pasta Pasta 線上點餐</div>
    <a href="https://www.bellinipasta.com.tw/menu" target="_blank" class="menu-link-btn">
      📖 開啟官方圖片菜單對照
    </a>
  </div>

  <div class="content-section">
    <div class="input-group">
      <label class="input-label">請輸入您的姓名：</label>
      <input type="text" id="user-name" class="input-box" placeholder="例如：小明">
    </div>

    <!-- 全品項菜單區 -->
    <div id="menu-list"></div>
  </div>

  <div class="cart-bar">
    <div class="cart-info">
      <span class="cart-badge" id="cart-count">0 項</span>
      <span class="cart-total" id="cart-total">小計 $0</span>
    </div>
    <button class="checkout-btn" onclick="submitOrder()">送出訂單</button>
  </div>
</div>

<script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw10CiiE_yatTCrTa_1yjiQRzlkIJCedkWhoEzhsDk3qIwgaUiuaotiCZsKYRxNpj88Rg/exec';

  // 完整官方菜單資料
  const fullMenu = [
    {
      category: "🥗 開胃菜 & 沙拉 (Appetizer & Salad)",
      items: [
        { name: "BELLINI 經典凱薩沙拉", price: 280 },
        { name: "煙燻鮭魚鮮蔬沙拉", price: 320 },
        { name: "香酥炸薯條", price: 160 },
        { name: "蒜味拿坡里炸雞", price: 240 },
        { name: "義式炒野菇", price: 220 },
        { name: "香煎干貝鮮蝦佐塔塔醬", price: 360 }
      ]
    },
    {
      category: "🍕 拿坡里手工比薩 (Pizza)",
      items: [
        { name: "瑪格麗特蕃茄起司比薩", price: 320 },
        { name: "夏威夷鮮蝦鳳梨比薩", price: 380 },
        { name: "羅勒青醬海鮮比薩", price: 420 },
        { name: "四種起司蜂蜜比薩", price: 360 },
        { name: "辣味培根薩拉米比薩", price: 380 },
        { name: "特選雙拼比薩 (自選兩種)", price: 450 }
      ]
    },
    {
      category: "🍝 經典義大利麵 (Pasta)",
      items: [
        { name: "經典波隆那肉醬起司麵", price: 320 },
        { name: "東京風蒜辣牛蒡雞肉麵", price: 340 },
        { name: "奶油培根蛋黃義大利麵", price: 320 },
        { name: "羅勒青醬鮮蝦義大利麵", price: 380 },
        { name: "香蒜白酒蛤蜊義大利麵", price: 340 },
        { name: "總匯海鮮蕃茄義大利麵", price: 420 },
        { name: "和風明太子鮮蝦義大利麵", price: 380 }
      ]
    },
    {
      category: "🥘 經典燉飯 & 主餐 (Risotto & Main)",
      items: [
        { name: "照燒醬烤雞野菇起司燉飯", price: 360 },
        { name: "威尼斯墨魚汁海鮮燉飯", price: 420 },
        { name: "牛肝菌野菇起司燉飯", price: 380 },
        { name: "美式頂級肋眼牛排 10oz", price: 980 },
        { name: "義式香草烤半雞", price: 680 }
      ]
    },
    {
      category: "🍰 甜點 & 飲品 (Dessert & Drink)",
      items: [
        { name: "主廚特製提拉米蘇", price: 160 },
        { name: "義式焦糖烤布蕾", price: 140 },
        { name: "特選冰紅茶 / 熱紅茶", price: 90 },
        { name: "美式咖啡 / 拿鐵", price: 110 },
        { name: "鮮榨柳橙汁", price: 130 },
        { name: "氣泡水 / 礦泉水", price: 80 }
      ]
    }
  ];

  let cart = [];

  // 渲染菜單列表
  function renderMenuList() {
    const container = document.getElementById('menu-list');
    container.innerHTML = '';

    fullMenu.forEach(cat => {
      const title = document.createElement('div');
      title.className = 'category-title';
      title.innerText = cat.category;
      container.appendChild(title);

      cat.items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'food-card';
        card.innerHTML = `
          <div class="food-info">
            <div class="food-name">${item.name}</div>
            <div class="food-price">$${item.price}</div>
          </div>
          <button class="add-btn" onclick="addToCart('${item.name}', ${item.price})">+ 加點</button>
        `;
        container.appendChild(card);
      });
    });
  }

  function addToCart(name, price) {
    cart.push({ name, price });
    updateCartUI();
  }

  function updateCartUI() {
    const total = cart.reduce((sum, item) => sum + item.price, 0);
    document.getElementById('cart-count').innerText = `${cart.length} 項`;
    document.getElementById('cart-total').innerText = `小計 $${total}`;
  }

  function submitOrder() {
    const userName = document.getElementById('user-name').value.trim();
    if (!userName) {
      alert('請先輸入您的姓名！');
      return;
    }
    if (cart.length === 0) {
      alert('請先選擇餐點！');
      return;
    }

    const total = cart.reduce((sum, item) => sum + item.price, 0);
    
    fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        userName: userName,
        items: cart,
        totalAmount: total,
        timestamp: new Date().toISOString()
      })
    })
    .then(() => {
      alert('訂單已成功送出！');
      cart = [];
      document.getElementById('user-name').value = '';
      updateCartUI();
    })
    .catch(() => alert('送出失敗，請重試'));
  }

  // 初始化菜單
  renderMenuList();
</script>

</body>
</html>
