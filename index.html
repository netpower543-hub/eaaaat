<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>線上點餐</title>
  <style>
    :root {
      --primary: #FF6B35;
      --primary-light: #FFF0EB;
      --dark: #2B2D42;
      --gray-bg: #F8F9FA;
      --gray-text: #6C757D;
      --border: #E9ECEF;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background-color: #EFEFEF;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .mobile-container {
      width: 100%;
      max-width: 480px;
      background: #FFFFFF;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      padding-bottom: 90px;
    }

    .header {
      padding: 16px;
      background: #FFFFFF;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border);
      text-align: center;
    }
    .store-name { font-size: 18px; font-weight: 700; color: var(--dark); }

    .menu-section { padding: 16px; flex: 1; }
    .category-title { font-size: 15px; font-weight: 700; color: var(--primary); margin: 16px 0 8px; }

    .food-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      margin-bottom: 10px;
      background: #FFF;
    }
    .food-info { flex: 1; padding-right: 12px; }
    .food-name { font-size: 15px; font-weight: 600; color: var(--dark); margin-bottom: 4px; }
    .food-price { font-size: 14px; font-weight: 700; color: var(--primary); }
    
    .add-btn {
      background: var(--primary);
      color: #FFF;
      border: none;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .add-btn:active { transform: scale(0.95); }

    .cart-bar {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 448px;
      background: var(--dark);
      color: #FFF;
      padding: 12px 20px;
      border-radius: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      z-index: 200;
    }
    .cart-info { display: flex; align-items: center; gap: 12px; }
    .cart-badge {
      background: var(--primary);
      color: #FFF;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
    }
    .cart-total { font-size: 16px; font-weight: 700; }
    .checkout-btn {
      background: var(--primary);
      color: #FFF;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="mobile-container">
  <div class="header">
    <div class="store-name">線上點餐機</div>
  </div>

  <div class="menu-section" id="menu-container">
    <!-- 菜單列表 -->
    <div class="category-title">🍝 義大利麵 / 燉飯</div>
    <div class="food-card">
      <div class="food-info">
        <div class="food-name">經典波隆那肉醬起司麵</div>
        <div class="food-price">$320</div>
      </div>
      <button class="add-btn" onclick="addToCart('經典波隆那肉醬起司麵', 320)">+ 加點</button>
    </div>
    <div class="food-card">
      <div class="food-info">
        <div class="food-name">東京風蒜辣牛蒡雞肉麵</div>
        <div class="food-price">$340</div>
      </div>
      <button class="add-btn" onclick="addToCart('東京風蒜辣牛蒡雞肉麵', 340)">+ 加點</button>
    </div>
    <div class="food-card">
      <div class="food-info">
        <div class="food-name">照燒醬烤雞野菇起司燉飯</div>
        <div class="food-price">$360</div>
      </div>
      <button class="add-btn" onclick="addToCart('照燒醬烤雞野菇起司燉飯', 360)">+ 加點</button>
    </div>

    <div class="category-title">🍕 手工比薩</div>
    <div class="food-card">
      <div class="food-info">
        <div class="food-name">夏威夷鮮蝦比薩</div>
        <div class="food-price">$380</div>
      </div>
      <button class="add-btn" onclick="addToCart('夏威夷鮮蝦比薩', 380)">+ 加點</button>
    </div>

    <div class="category-title">🥗 開胃菜與飲品</div>
    <div class="food-card">
      <div class="food-info">
        <div class="food-name">經典凱薩沙拉</div>
        <div class="food-price">$220</div>
      </div>
      <button class="add-btn" onclick="addToCart('經典凱薩沙拉', 220)">+ 加點</button>
    </div>
    <div class="food-card">
      <div class="food-info">
        <div class="food-name">特選冰紅茶</div>
        <div class="food-price">$90</div>
      </div>
      <button class="add-btn" onclick="addToCart('特選冰紅茶', 90)">+ 加點</button>
    </div>
  </div>

  <div class="cart-bar">
    <div class="cart-info">
      <span class="cart-badge" id="cart-count">0 項</span>
      <span class="cart-total" id="cart-total">小計 $0</span>
    </div>
    <button class="checkout-btn" onclick="submitOrder()">送出訂單</button>
  </div>
</div>

<script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw10CiiE_yatTCrTa_1yjiQRzlkIJCedkWhoEzhsDk3qIwgaUiuaotiCZsKYRxNpj88Rg/exec';
  let cart = [];

  function addToCart(name, price) {
    cart.push({ name, price });
    updateCartUI();
  }

  function updateCartUI() {
    const total = cart.reduce((sum, item) => sum + item.price, 0);
    document.getElementById('cart-count').innerText = `${cart.length} 項`;
    document.getElementById('cart-total').innerText = `小計 $${total}`;
  }

  function submitOrder() {
    if (cart.length === 0) {
      alert('請先選擇餐點！');
      return;
    }

    const total = cart.reduce((sum, item) => sum + item.price, 0);
    
    fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ items: cart, totalAmount: total, timestamp: new Date().toISOString() })
    })
    .then(() => {
      alert('訂單已成功送出！');
      cart = [];
      updateCartUI();
    })
    .catch(() => alert('送出失敗，請重試'));
  }
</script>

</body>
</html>
