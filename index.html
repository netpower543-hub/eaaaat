    .menu-link-btn {

      font-size: 14px;
      border-radius: 10px;

    .content-section { padding: 16px; flex: 1; }
    .input-group { margin-bottom: 12px; }
    .input-label { font-size: 14px; font-weight: 700; color: var(--dark); margin-bottom: 6px; display: block; }
    .input-box {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }
    .input-box:focus {

    }

    .search-box {

    .category-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--primary);
      margin: 20px 0 10px;
      padding-bottom: 4px;
      border-bottom: 2px solid var(--primary-light);
    }

    .food-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      margin-bottom: 8px;
      background: #FFF;
    }
    .food-info { flex: 1; padding-right: 8px; }
    .food-name { font-size: 14px; font-weight: 600; color: var(--dark); margin-bottom: 2px; }
    .food-price { font-size: 14px; font-weight: 700; color: var(--primary); }
    
    .add-btn {
      background: var(--primary-light);
      color: var(--primary);
      border: 1px solid var(--primary);
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .add-btn:active { background: var(--primary); color: #FFF; }

    .no-result {
      text-align: center;
      color: var(--gray-text);
      padding: 30px 0;
      font-size: 14px;
    }

    .cart-bar {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 448px;
      background: var(--dark);
      color: #FFF;
      padding: 12px 20px;
      border-radius: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      z-index: 200;
    }
    .cart-info { display: flex; align-items: center; gap: 12px; }
    .cart-badge {
      background: var(--primary);
      color: #FFF;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
    }
    .cart-total { font-size: 15px; font-weight: 700; }
    .checkout-btn {
      background: var(--primary);
      color: #FFF;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>

    },

        { name: "Estrella Frizzante (750ml)", price: 680 },

        { name: "Templum Tempranillo (杯)", price: 150 },
        { name: "Templum Tempranillo (750ml)", price: 680 },

      ]
    }
  ];

  let cart = [];

  // 渲染菜單列表（支援關鍵字過濾）
  function filterMenu() {
    const keyword = document.getElementById('search-input').value.trim().toLowerCase();
    const container = document.getElementById('menu-list');
    container.innerHTML = '';

    let hasResult = false;

    fullMenu.forEach(cat => {
      // 篩選出符合關鍵字的餐點
      const matchedItems = cat.items.filter(item => 
        item.name.toLowerCase().includes(keyword)
      );

      if (matchedItems.length > 0) {
        hasResult = true;
        const title = document.createElement('div');
        title.className = 'category-title';
        title.innerText = cat.category;
        container.appendChild(title);

        matchedItems.forEach(item => {
          const card = document.createElement('div');
          card.className = 'food-card';
          card.innerHTML = `
            <div class="food-info">
              <div class="food-name">${item.name}</div>
              <div class="food-price">$${item.price}</div>
            </div>
            <button class="add-btn" onclick="addToCart('${item.name}', ${item.price})">+ 加點</button>
          `;
          container.appendChild(card);
        });
      }
    });

    if (!hasResult) {
      container.innerHTML = `<div class="no-result">找不到符合「${keyword}」的餐點</div>`;
    }
  }

  function addToCart(name, price) {
    cart.push({ name, price });
    updateCartUI();
  }

  function updateCartUI() {
    const total = cart.reduce((sum, item) => sum + item.price, 0);
    document.getElementById('cart-count').innerText = `${cart.length} 項`;
    document.getElementById('cart-total').innerText = `小計 $${total}`;
  }

  function submitOrder() {
    const userName = document.getElementById('user-name').value.trim();
    if (!userName) {
      alert('請先輸入訂購人姓名！');
      return;
    }
    if (cart.length === 0) {
      alert('請先選擇餐點！');
      return;
    }

    const total = cart.reduce((sum, item) => sum + item.price, 0);
    
    fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        userName: userName,
        items: cart,
        totalAmount: total,
        timestamp: new Date().toISOString()
      })
    })
    .then(() => {
      alert('訂單已成功送出！');
      cart = [];
      document.getElementById('user-name').value = '';
      updateCartUI();
    })
    .catch(() => alert('送出失敗，請重試'));
  }

  // 初始化菜單
  filterMenu();
</script>
