<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>線上點餐機</title>
  <style>
    :root {
      --primary: #FF6B35;
      --primary-light: #FFF0EB;
      --dark: #2B2D42;
      --gray-bg: #F8F9FA;
      --gray-text: #6C757D;
      --border: #E9ECEF;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

    body {
      background-color: #EFEFEF;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    /* 手機容器 */
    .mobile-container {
      width: 100%;
      max-width: 480px;
      background: #FFFFFF;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 0 20px rgba(0,0,0,0.05);
      padding-bottom: 90px;
    }

    /* 頂部 Header */
    .header {
      padding: 20px 16px 12px;
      background: #FFFFFF;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border);
    }
    .store-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .store-name { font-size: 20px; font-weight: 700; color: var(--dark); }
    .store-status { font-size: 12px; background: #E6F4EA; color: #137333; padding: 4px 8px; border-radius: 20px; font-weight: 600; }
    
    /* 優惠 Banner */
    .promo-banner {
      background: var(--primary-light);
      color: var(--primary);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 分類導覽 Bar */
    .category-bar {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      overflow-x: auto;
      background: #FFFFFF;
      border-bottom: 1px solid var(--border);
      scrollbar-width: none;
    }
    .category-bar::-webkit-scrollbar { display: none; }
    .cat-btn {
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: #FFF;
      color: var(--gray-text);
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }
    .cat-btn.active {
      background: var(--primary);
      color: #FFF;
      border-color: var(--primary);
    }

    /* 餐點列表 */
    .menu-section { padding: 16px; }
    .section-title { font-size: 16px; font-weight: 700; color: var(--dark); margin-bottom: 12px; }

    .food-card {
      display: flex;
      gap: 12px;
      padding: 12px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      margin-bottom: 12px;
      background: #FFF;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .food-card:active { transform: scale(0.98); }
    .food-img {
      width: 88px;
      height: 88px;
      border-radius: 12px;
      object-fit: cover;
      background: var(--gray-bg);
    }
    .food-details {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .food-name { font-size: 15px; font-weight: 600; color: var(--dark); margin-bottom: 4px; }
    .food-desc { font-size: 12px; color: var(--gray-text); line-height: 1.3; margin-bottom: 8px; }
    .food-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .food-price { font-size: 16px; font-weight: 700; color: var(--primary); }
    .add-btn {
      background: var(--primary-light);
      color: var(--primary);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: none;
      font-size: 18px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* 懸浮購物車 Bar */
    .cart-bar {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 448px;
      background: var(--dark);
      color: #FFF;
      padding: 12px 20px;
      border-radius: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      z-index: 200;
    }
    .cart-info { display: flex; align-items: center; gap: 12px; }
    .cart-badge {
      background: var(--primary);
      color: #FFF;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
    }
    .cart-total { font-size: 16px; font-weight: 700; }
    .checkout-btn {
      background: var(--primary);
      color: #FFF;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="mobile-container">
  <!-- 頂部資訊 -->
  <div class="header">
    <div class="store-info">
      <div class="store-name">美味手作坊 🍔</div>
      <div class="store-status">接單中</div>
    </div>
    <div class="promo-banner">
      🎉 全店滿 $300 折 $30 | 支持線上支付與到店付款
    </div>
  </div>

  <!-- 分類導覽列 -->
  <div class="category-bar">
    <button class="cat-btn active">🔥 熱銷推薦</button>
    <button class="cat-btn">主餐系列</button>
    <button class="cat-btn">點心炸物</button>
    <button class="cat-btn">特調飲料</button>
  </div>

  <!-- 餐點列表區 -->
  <div class="menu-section">
    <div class="section-title">熱銷推薦</div>

    <!-- 餐點 1 -->
    <div class="food-card" onclick="addToCart('招牌牛肉起司堡', 140)">
      <img class="food-img" src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=300&auto=format&fit=crop" alt="漢堡">
      <div class="food-details">
        <div>
          <div class="food-name">招牌牛肉起司堡</div>
          <div class="food-desc">100% 純牛肉漢堡排搭配切達起司與秘製醬汁</div>
        </div>
        <div class="food-bottom">
          <div class="food-price">$140</div>
          <button class="add-btn">+</button>
        </div>
      </div>
    </div>

    <!-- 餐點 2 -->
    <div class="food-card" onclick="addToCart('錫蘭鮮奶茶', 55)">
      <img class="food-img" src="https://images.unsplash.com/photo-1576107232684-1279f3908594?w=300&auto=format&fit=crop" alt="鮮奶茶">
      <div class="food-details">
        <div>
          <div class="food-name">錫蘭鮮奶茶</div>
          <div class="food-desc">濃郁錫蘭紅茶配上純鮮奶，香醇滑順</div>
        </div>
        <div class="food-bottom">
          <div class="food-price">$55</div>
          <button class="add-btn">+</button>
        </div>
      </div>
    </div>

    <!-- 餐點 3 -->
    <div class="food-card" onclick="addToCart('美式黃金脆薯', 45)">
      <img class="food-img" src="https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=300&auto=format&fit=crop" alt="薯條">
      <div class="food-details">
        <div>
          <div class="food-name">美式黃金脆薯</div>
          <div class="food-desc">外酥內軟，附上經典蕃茄醬</div>
        </div>
        <div class="food-bottom">
          <div class="food-price">$45</div>
          <button class="add-btn">+</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 底部懸浮購物車 -->
  <div class="cart-bar">
    <div class="cart-info">
      <span class="cart-badge" id="cart-count">0 項</span>
      <span class="cart-total" id="cart-total">小計 $0</span>
    </div>
    <button class="checkout-btn" onclick="submitOrder()">去結帳 →</button>
  </div>
</div>

<script>
  // Google Apps Script 後端 URL
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw10CiiE_yatTCrTa_1yjiQRzlkIJCedkWhoEzhsDk3qIwgaUiuaotiCZsKYRxNpj88Rg/exec';

  let cart = [];

  function addToCart(name, price) {
    cart.push({ name, price });
    updateCartUI();
  }

  function updateCartUI() {
    const total = cart.reduce((sum, item) => sum + item.price, 0);
    document.getElementById('cart-count').innerText = `${cart.length} 項`;
    document.getElementById('cart-total').innerText = `小計 $${total}`;
  }

  function submitOrder() {
    if (cart.length === 0) {
      alert('請先選擇餐點再進行結帳！');
      return;
    }

    const total = cart.reduce((sum, item) => sum + item.price, 0);
    const orderData = {
      items: cart,
      totalAmount: total,
      timestamp: new Date().toISOString()
    };

    // 發送訂單至 Google Apps Script
    fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify(orderData)
    })
    .then(() => {
      alert('訂單已成功送出！感謝您的點餐。');
      cart = [];
      updateCartUI();
    })
    .catch(error => {
      console.error('Error:', error);
      alert('送出訂單時發生錯誤，請重試。');
    });
  }
</script>

</body>
</html>
