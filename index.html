<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>線上點餐</title>
  <style>
    :root {
      --primary: #FF6B35;
      --primary-light: #FFF0EB;
      --dark: #2B2D42;
      --gray-bg: #F8F9FA;
      --gray-text: #6C757D;
      --border: #E9ECEF;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background-color: #EFEFEF;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .mobile-container {
      width: 100%;
      max-width: 480px;
      background: #FFFFFF;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      padding-bottom: 90px;
    }

    .header {
      padding: 16px;
      background: #FFFFFF;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border);
      text-align: center;
    }
    .store-name { font-size: 18px; font-weight: 700; color: var(--dark); }

    .menu-section { padding: 16px; flex: 1; }
    .loading-text { text-align: center; color: var(--gray-text); margin-top: 40px; font-size: 15px; }

    .food-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      margin-bottom: 12px;
      background: #FFF;
    }
    .food-name { font-size: 16px; font-weight: 600; color: var(--dark); margin-bottom: 4px; }
    .food-price { font-size: 15px; font-weight: 700; color: var(--primary); }
    
    .add-btn {
      background: var(--primary);
      color: #FFF;
      border: none;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .cart-bar {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 448px;
      background: var(--dark);
      color: #FFF;
      padding: 12px 20px;
      border-radius: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      z-index: 200;
    }
    .cart-info { display: flex; align-items: center; gap: 12px; }
    .cart-badge {
      background: var(--primary);
      color: #FFF;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
    }
    .cart-total { font-size: 16px; font-weight: 700; }
    .checkout-btn {
      background: var(--primary);
      color: #FFF;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="mobile-container">
  <div class="header">
    <div class="store-name">線上點餐</div>
  </div>

  <div class="menu-section" id="menu-container">
    <div class="loading-text">載入菜單中...</div>
  </div>

  <div class="cart-bar">
    <div class="cart-info">
      <span class="cart-badge" id="cart-count">0 項</span>
      <span class="cart-total" id="cart-total">小計 $0</span>
    </div>
    <button class="checkout-btn" onclick="submitOrder()">送出訂單</button>
  </div>
</div>

<script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw10CiiE_yatTCrTa_1yjiQRzlkIJCedkWhoEzhsDk3qIwgaUiuaotiCZsKYRxNpj88Rg/exec';
  let cart = [];

  // 自動從你的 Google Apps Script 載入菜單
  fetch(SCRIPT_URL)
    .then(res => res.json())
    .then(data => {
      const container = document.getElementById('menu-container');
      container.innerHTML = '';
      
      // 假設你的 API 回傳 array: [{name: "品項", price: 100}, ...]
      data.forEach(item => {
        const card = document.createElement('div');
        card.className = 'food-card';
        card.innerHTML = `
          <div>
            <div class="food-name">${item.name}</div>
            <div class="food-price">$${item.price}</div>
          </div>
          <button class="add-btn" onclick="addToCart('${item.name}', ${item.price})">+ 加點</button>
        `;
        container.appendChild(card);
      });
    })
    .catch(err => {
      // 若後端僅支援 POST，顯示點餐提示
      document.getElementById('menu-container').innerHTML = '<div class="loading-text">請選擇餐點進行結帳</div>';
    });

  function addToCart(name, price) {
    cart.push({ name, price });
    updateCartUI();
  }

  function updateCartUI() {
    const total = cart.reduce((sum, item) => sum + item.price, 0);
    document.getElementById('cart-count').innerText = `${cart.length} 項`;
    document.getElementById('cart-total').innerText = `小計 $${total}`;
  }

  function submitOrder() {
    if (cart.length === 0) {
      alert('請先選擇餐點！');
      return;
    }

    const total = cart.reduce((sum, item) => sum + item.price, 0);
    
    fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ items: cart, totalAmount: total, timestamp: new Date().toISOString() })
    })
    .then(() => {
      alert('訂單已送出！');
      cart = [];
      updateCartUI();
    })
    .catch(() => alert('送出失敗，請重試'));
  }
</script>

</body>
</html>
