    :root {

      --dark: #2B2D42;
      --gray-bg: #F8F9FA;
      --gray-text: #6C757D;
      --border: #E9ECEF;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background-color: #EFEFEF;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .mobile-container {
      width: 100%;
      max-width: 480px;
      background: #FFFFFF;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      padding-bottom: 100px;
    }

    .header {
      padding: 16px;
      background: #FFFFFF;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border);
      text-align: center;
    }
    .store-name { font-size: 18px; font-weight: 700; color: var(--dark); margin-bottom: 8px; }
    
    .menu-link-btn {
      display: inline-block;
      width: 100%;
      padding: 10px;
      background: var(--primary-light);
      color: var(--primary);
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      border-radius: 10px;
      border: 1px solid var(--primary);
    }

    .content-section { padding: 16px; flex: 1; }
    .input-group { margin-bottom: 12px; }
    .input-label { font-size: 14px; font-weight: 700; color: var(--dark); margin-bottom: 6px; display: block; }
    .input-box {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }
    .input-box:focus { border-color: var(--primary); }
    .search-box { background: var(--gray-bg); }

    .category-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--primary);
      margin: 20px 0 10px;
      padding-bottom: 4px;
      border-bottom: 2px solid var(--primary-light);
    }

    .food-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      margin-bottom: 8px;
      background: #FFF;
    }
    .food-info { flex: 1; padding-right: 8px; }
    .food-name { font-size: 14px; font-weight: 600; color: var(--dark); margin-bottom: 2px; }
    .food-price { font-size: 14px; font-weight: 700; color: var(--primary); }
    
    .add-btn {
      background: var(--primary-light);
      color: var(--primary);
      border: 1px solid var(--primary);
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .no-result { text-align: center; color: var(--gray-text); padding: 30px 0; font-size: 14px; }

    /* 購物車底欄 */
    .cart-bar {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 448px;
      background: var(--dark);
      color: #FFF;
      padding: 12px 20px;
      border-radius: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      z-index: 200;
      cursor: pointer;
    }
    .cart-info { display: flex; align-items: center; gap: 12px; }
    .cart-badge {
      background: var(--primary);
      color: #FFF;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
    }
    .cart-total { font-size: 15px; font-weight: 700; }
    .checkout-btn {
      background: var(--primary);
      color: #FFF;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Modal 通用樣式 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 300;
      display: none;
      justify-content: center;
      align-items: flex-end;
    }
    .modal-overlay.active { display: flex; }

    .modal-content {
      width: 100%;
      max-width: 480px;
      background: #FFF;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 20px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      animation: slideUp 0.2s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .modal-title { font-size: 16px; font-weight: 700; color: var(--dark); }
    .close-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--gray-text); }

    .modal-body { flex: 1; overflow-y: auto; padding: 12px 0; }

    .option-title { font-size: 14px; font-weight: 700; color: var(--dark); margin-bottom: 6px; }
    .option-select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 14px;
      outline: none;
      background: #FFF;
    }

    .radio-label {
      flex: 1;
      text-align: center;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      background: var(--gray-bg);
    }
    .radio-input { display: none; }
    .radio-input:checked + .radio-label {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);

      justify-content: space-between;
      align-items: center;
      padding: 10px 0;

</head>

<div class="mobile-container">

<!-- 飲料客製化 Modal -->
<div class="modal-overlay" id="bev-modal">

      </div>
      <div class="option-group">

        <input type="text" id="bev-note" class="input-box" placeholder="選填，例如：去冰、微糖">
      </div>
    </div>
    <div class="modal-footer">
      <button class="submit-order-btn" onclick="confirmBevToCart()">加入購物車</button>
    </div>
  </div>
</div>

</div>

    beverage: ["義大利咖啡 (冰)", "義大利咖啡 (熱)", "拿鐵咖啡 (冰)", "拿鐵咖啡 (熱)", "焦糖瑪奇朵 (冰)", "焦糖瑪奇朵 (熱)", "可樂", "雪碧", "零卡可樂", "可爾必思", "100%新鮮繽紛檸檬漾", "覆盆子玫瑰烏龍茶 (熱)", "皇家宮廷伯爵茶 (熱)", "悠活舒緩茶 (熱)", "檸檬鮮活冰綠茶", "熱帶鮮果冰紅茶", "黑糖鮮奶冰茶"]
  };

  let cart = [];
  let currentEditingSet = null;
  let currentEditingBev = null;

  function filterMenu() {
    const keyword = document.getElementById('search-input').value.trim().toLowerCase();
    const container = document.getElementById('menu-list');
    container.innerHTML = '';

    let hasResult = false;

    fullMenu.forEach(cat => {
      const matchedItems = cat.items.filter(item => 
        item.name.toLowerCase().includes(keyword)
      );

      if (matchedItems.length > 0) {
        hasResult = true;
        const title = document.createElement('div');
        title.className = 'category-title';
        title.innerText = cat.category;
        container.appendChild(title);

        matchedItems.forEach(item => {
          const card = document.createElement('div');
          card.className = 'food-card';
          
          let btnOnClick = `addToCart('${item.name}', ${item.price})`;
          let btnText = '+ 加點';

          if (item.isSet) {
            btnOnClick = `openSetModal('${item.name}', ${item.price}, '${item.setType}')`;
            btnText = '選擇套餐內容';
          } else if (item.isBev) {
            btnOnClick = `openBevModal('${item.name}', ${item.price}, ${item.hasHot})`;
            btnText = '選擇冰熱/備註';
          }

          card.innerHTML = `
            <div class="food-info">
              <div class="food-name">${item.name}</div>
              <div class="food-price">$${item.price}</div>
            </div>
            <button class="add-btn" onclick="${btnOnClick}">${btnText}</button>
          `;
          container.appendChild(card);
        });
      }
    });

    if (!hasResult) {
      container.innerHTML = `<div class="no-result">找不到符合「${keyword}」的餐點</div>`;
    }
  }

  // 飲料彈窗
  function openBevModal(name, price, hasHot) {
    currentEditingBev = { name, price };
    document.getElementById('bev-modal-title').innerText = name;
    document.getElementById('bev-note').value = '';

    const tempGroup = document.getElementById('temp-option-group');
    if (!hasHot) {
      tempGroup.style.display = 'none';
    } else {
      tempGroup.style.display = 'block';
      document.getElementById('temp-ice').checked = true;
    }

    document.getElementById('bev-modal').classList.add('active');
  }

  function closeBevModal() {
    document.getElementById('bev-modal').classList.remove('active');
  }

  function confirmBevToCart() {
    const note = document.getElementById('bev-note').value.trim();
    const tempGroupVisible = document.getElementById('temp-option-group').style.display !== 'none';
    
    let subTextList = [];
    if (tempGroupVisible) {
      const temp = document.querySelector('input[name="bev-temp"]:checked').value;
      subTextList.push(`溫度: ${temp}`);
    }
    if (note) {
      subTextList.push(`備註: ${note}`);
    }

    cart.push({
      id: Date.now(),
      name: currentEditingBev.name,
      price: currentEditingBev.price,
      subText: subTextList.join(' | ')
    });

    closeBevModal();
    updateCartUI();
  }

  // 套餐彈窗
  function openSetModal(name, price, setType) {
    currentEditingSet = { name, price, setType };
    document.getElementById('set-title').innerText = name;
    
    const body = document.getElementById('set-options-body');
    body.innerHTML = '';

    const buildSelect = (label, id, options) => {
      let html = `<div class="option-group"><div class="option-title">${label}</div><select id="${id}" class="option-select">`;
      options.forEach(opt => html += `<option value="${opt}">${opt}</option>`);
      html += `</select></div>`;
      return html;
    };

    let formHTML = '';
    formHTML += buildSelect('1. 沙拉 (任選 1)', 'set-salad', setOptionsList.salad);
    formHTML += buildSelect('2. 開胃菜 ($300內任選 1)', 'set-appetizer', setOptionsList.appetizer);

    if (setType === 'classic') {
      formHTML += buildSelect('3. 比薩 ($420內任選 1)', 'set-pizza', setOptionsList.pizza);
    }

    formHTML += buildSelect(setType === 'classic' ? '4. 義大利麵 ($300內任選 1)' : '3. 義大利麵 ($300內任選 1)', 'set-pasta', setOptionsList.pasta);
    formHTML += buildSelect('飲料 1 ($120內任選 1)', 'set-bev1', setOptionsList.beverage);
    formHTML += buildSelect('飲料 2 ($120內任選 1)', 'set-bev2', setOptionsList.beverage);

    body.innerHTML = formHTML;
    document.getElementById('set-modal').classList.add('active');
  }

  function closeSetModal() {
    document.getElementById('set-modal').classList.remove('active');
  }

  function confirmSetToCart() {
    const salad = document.getElementById('set-salad').value;
    const appetizer = document.getElementById('set-appetizer').value;
    const pasta = document.getElementById('set-pasta').value;
    const bev1 = document.getElementById('set-bev1').value;
    const bev2 = document.getElementById('set-bev2').value;

    let subItems = [`沙拉: ${salad}`, `開胃菜: ${appetizer}`];
    
    if (currentEditingSet.setType === 'classic') {
      const pizza = document.getElementById('set-pizza').value;
      subItems.push(`披薩: ${pizza}`);
    }
    
    subItems.push(`義大利麵: ${pasta}`, `飲料: ${bev1}, ${bev2}`);

    cart.push({
      id: Date.now(),
      name: currentEditingSet.name,
      price: currentEditingSet.price,
      subText: subItems.join(' | ')
    });

    closeSetModal();
    updateCartUI();
  }

  function addToCart(name, price) {
    cart.push({
      id: Date.now(),
      name: name,
      price: price,
      subText: ''
    });
    updateCartUI();
  }

  function removeFromCart(index) {
    cart.splice(index, 1);
    updateCartUI();
    renderCartModalItems();
  }

  function updateCartUI() {
    const total = cart.reduce((sum, item) => sum + item.price, 0);
    document.getElementById('cart-count').innerText = `${cart.length} 項`;
    document.getElementById('cart-total').innerText = `小計 $${total}`;
  }

  function openCartModal() {
    renderCartModalItems();
    document.getElementById('cart-modal').classList.add('active');
  }

  function closeCartModal() {
    document.getElementById('cart-modal').classList.remove('active');
  }

  function renderCartModalItems() {
    const listContainer = document.getElementById('cart-items-list');
    listContainer.innerHTML = '';

    if (cart.length === 0) {
      listContainer.innerHTML = '<div class="no-result">購物車目前是空的！</div>';
      return;
    }

    cart.forEach((item, index) => {
      const row = document.createElement('div');
      row.className = 'cart-item';
      row.innerHTML = `
        <div class="cart-item-info">
          <div class="cart-item-name">${item.name}</div>
          ${item.subText ? `<div class="cart-item-sub">${item.subText}</div>` : ''}
        </div>
        <div class="cart-item-price">$${item.price}</div>
        <button class="qty-btn" onclick="removeFromCart(${index})">✕</button>
      `;
      listContainer.appendChild(row);
    });
  }

  function submitOrder() {
    const userName = document.getElementById('user-name').value.trim();
    if (!userName) {
      alert('請先輸入訂購人姓名！');
      return;
    }
    if (cart.length === 0) {
      alert('請先選擇餐點！');
      return;
    }

    const total = cart.reduce((sum, item) => sum + item.price, 0);

    const formattedItems = cart.map(item => ({
      name: item.subText ? `${item.name} (${item.subText})` : item.name,
      price: item.price
    }));

    fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        userName: userName,
        items: formattedItems,
        totalAmount: total,
        timestamp: new Date().toISOString()
      })
    })
    .then(() => {
      alert('訂單已成功送出！');
      cart = [];
      document.getElementById('user-name').value = '';
      updateCartUI();
      closeCartModal();
    })
    .catch(() => alert('送出失敗，請重試'));
  }

  filterMenu();
</script>

</body>
</html>
